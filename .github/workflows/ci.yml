name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Default to nothing; each job asks for exactly what it needs. Without this,
# every job here inherits the repository default GITHUB_TOKEN scope — and this
# workflow runs on `pull_request`, so that token is handed to code from any
# branch a contributor opens a PR from.
permissions: {}

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # Only reads the tree: actions/checkout needs `contents: read` and this
    # job needs nothing else. No issues, no PR comments, no package writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This action selects the toolchain by *ref*: `@stable` is a branch, not a
      # version. Pinning the SHA therefore means also passing the selection as an
      # input — the pinned commit declares `toolchain` as required. Same pin and
      # same input as release.yml, so CI and the release build the same way.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  python-sdk:
    # Unit tests against a stub, then the SDK's integration suite against a
    # LIVE gateway↔simulator pair in MQ mode — the same stack users run.
    name: python sdk (live stack)
    runs-on: ubuntu-latest
    # Only reads the tree: actions/checkout needs `contents: read` and this
    # job needs nothing else. No issues, no PR comments, no package writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Two installs, both pinned, because `pip install pytest ./sdk/python`
      # was this repository's only unpinned dependency (OpenSSF Scorecard,
      # Pinned-Dependencies). They pin differently because they are different
      # things: pytest comes from PyPI and is pinned by artifact hash; the SDK
      # is this commit's own source and is pinned by being built from it.
      - name: Install pytest (hash-pinned)
        run: pip install --require-hashes -r .github/requirements/pytest.txt

      # Still "as a user would": a wheel, built from sdk/python by the same
      # PEP 517 backend PyPI would use, then installed. Building it here rather
      # than installing the directory in place keeps the packaging itself under
      # test — a broken `[tool.setuptools.packages.find]` fails at this step
      # instead of surfacing as a mysterious ImportError later.
      - name: Build the SDK wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/sdk-wheel ./sdk/python

      - name: Install the SDK wheel
        run: pip install /tmp/sdk-wheel/*.whl

      - name: Build the stack
        run: cargo build -p fednow-sim -p fednow-gateway
      - name: Launch sim + gateway (MQ mode, fast reconcile timings)
        run: |
          ./target/debug/fednow-sim &
          FEDNOW_GW_SOUTHBOUND=mq FEDNOW_GW_SWEEP_SECS=1 \
            FEDNOW_GW_TIMEOUT_SECS=3 FEDNOW_GW_BACKOFF_SECS=2 \
            FEDNOW_GW_DB=/tmp/sdk-ci-gateway.db \
            ./target/debug/fednow-gateway &
          timeout 30 bash -c 'until curl -sf localhost:8090/healthz >/dev/null; do sleep 1; done'
      - name: Unit + integration tests
        run: FEDNOW_GW_URL=http://localhost:8090 python -m pytest sdk/python -q

  java-sdk:
    # Same recipe as the Python job: unit tests on a stub, then the
    # integration suite against a LIVE gateway↔simulator pair in MQ mode.
    name: java sdk (live stack)
    runs-on: ubuntu-latest
    # Only reads the tree: actions/checkout needs `contents: read` and this
    # job needs nothing else. No issues, no PR comments, no package writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build the stack
        run: cargo build -p fednow-sim -p fednow-gateway
      - name: Launch sim + gateway (MQ mode, fast reconcile timings)
        run: |
          ./target/debug/fednow-sim &
          FEDNOW_GW_SOUTHBOUND=mq FEDNOW_GW_SWEEP_SECS=1 \
            FEDNOW_GW_TIMEOUT_SECS=3 FEDNOW_GW_BACKOFF_SECS=2 \
            FEDNOW_GW_DB=/tmp/java-sdk-ci-gateway.db \
            ./target/debug/fednow-gateway &
          timeout 30 bash -c 'until curl -sf localhost:8090/healthz >/dev/null; do sleep 1; done'
      - name: Unit + integration tests
        run: FEDNOW_GW_URL=http://localhost:8090 mvn -q -B -f sdk/java/pom.xml test

  xsd-validate:
    # Validates the valid XML fixtures against the official ISO 20022 schemas
    # vendored in core/schemas/ (see core/schemas/README.md for provenance).
    name: XSD validation
    runs-on: ubuntu-latest
    # Only reads the tree: actions/checkout needs `contents: read` and this
    # job needs nothing else. No issues, no PR comments, no package writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: pacs.008 fixtures
        run: xmllint --noout --schema core/schemas/pacs.008.001.08.xsd core/tests/fixtures/pacs008_valid*.xml
      - name: pacs.002 fixtures
        run: xmllint --noout --schema core/schemas/pacs.002.001.10.xsd core/tests/fixtures/pacs002_valid*.xml
      - name: head.001 fixtures
        run: xmllint --noout --schema core/schemas/head.001.001.02.xsd core/tests/fixtures/head001_valid*.xml
      - name: pacs.028 fixtures
        run: xmllint --noout --schema core/schemas/pacs.028.001.03.xsd core/tests/fixtures/pacs028_valid*.xml
      - name: pacs.004 fixtures
        run: xmllint --noout --schema core/schemas/pacs.004.001.10.xsd core/tests/fixtures/pacs004_valid*.xml
      - name: camt.056 fixtures
        run: xmllint --noout --schema core/schemas/camt.056.001.08.xsd core/tests/fixtures/camt056_valid*.xml
      - name: camt.029 fixtures
        run: xmllint --noout --schema core/schemas/camt.029.001.09.xsd core/tests/fixtures/camt029_valid*.xml

  # ---------------------------------------------------------------- site --
  # The site is generated FROM this repository's markdown, and it states facts
  # derived from Cargo.toml, CHANGELOG.md, SECURITY.md and the workflow files:
  # the version, the release status, which release started signing, the SBOM
  # formats, the cargo-audit / Scorecard / Dependabot cadences. So a change here
  # can break the site build (sync-docs.mjs fails on a relative link that
  # resolves nowhere, project-facts.mjs fails on a source it can no longer
  # parse) or falsify it (a reworded privacy claim, a reintroduced routing
  # number, the mark in a metatag). Vercel would find that out on deploy, after
  # merge. This finds it in review.
  #
  # Two jobs rather than one: GitHub has no per-job `paths:` filter, and the
  # workflow-level `on:` has none because the Rust jobs need to run on every
  # change. So `site-changes` works out whether this diff touches anything the
  # site reads, and `site` runs only if it does.

  site-changes:
    name: site — does this diff reach it?
    runs-on: ubuntu-latest
    permissions:
      # Reads the tree and the base branch to diff against. Nothing else.
      contents: read
    outputs:
      affected: ${{ steps.decide.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to resolve a merge base against the target branch.
          fetch-depth: 0
      - id: decide
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Everything the site reads or republishes. ANY markdown counts, not
          # just the root files: sync-docs.mjs republishes gateway/README.md,
          # simulator/README.md, conformance/README.md and both SDK READMEs as
          # site pages, so a crate's README is a site source too. Kept
          # deliberately wide — skipping a job that should have run is a broken
          # deploy, while running one that need not have costs about forty
          # seconds.
          patterns='^site/|\.md$|^docs/|^Cargo\.toml$|^\.github/workflows/'

          base=""
          if [ -n "${BASE_REF:-}" ]; then
            # pull_request: diff against the merge base with the target branch.
            git fetch --no-tags origin "$BASE_REF"
            base="$(git merge-base FETCH_HEAD HEAD || true)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # push: diff against whatever the branch pointed at before.
            base="$BEFORE"
          fi

          # Fail SAFE, not quiet. A first push to a branch, a force-push or a
          # squashed base all leave no usable base commit; in that case run the
          # site job rather than assume it is unaffected.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable diff base — running the site job anyway."
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          if printf '%s\n' "$changed" | grep -qE "$patterns"; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "-> the site reads at least one of these; running its build and checks."
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing the site reads changed; skipping."
          fi

  site:
    name: site — build + trademark/privacy checks
    needs: site-changes
    if: needs.site-changes.outputs.affected == 'true'
    runs-on: ubuntu-latest
    # Only reads the tree. The site deploy is Vercel's, via its own Git
    # integration — nothing here publishes anything.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin reviewed by reading action.yml at this commit: it accepts
      # node-version-file, cache and cache-dependency-path, which is what the
      # step below passes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install
        working-directory: site
        run: npm ci
      # Runs sync-docs.mjs first, which regenerates every page from the
      # repository's markdown and derives the project facts — so a broken
      # relative link or an unparseable source fails right here.
      - name: build
        working-directory: site
        run: npm run build
      # The trademark, footer, routing-number, analytics, social-preview and
      # edit-link checks, then the self-test that proves each of them can
      # actually fail.
      - name: check
        working-directory: site
        run: npm run check

  # -------------------------------------------------------------- docker --
  # QUICKSTART.md's whole promise is `docker compose up --build` on a machine
  # with nothing installed. Nothing tested that. The Rust jobs above build and
  # run the binaries on the runner, which proves they work against the runner's
  # libraries — not against the ones inside the image that ships them.
  #
  # That gap is not hypothetical. Both Dockerfiles build in one stage and run in
  # another, and #90 found the two had drifted apart: the floating `rust:1-slim`
  # tag had moved to Debian 13 "trixie" while the runtime stage was still
  # `debian:bookworm-slim` (Debian 12). A Rust binary links glibc dynamically, so
  # a binary built against trixie's 2.41 cannot start on bookworm's 2.36 — the
  # image builds perfectly and the container dies on its first instruction.
  # `cargo test` cannot see that, and neither can a human who does not happen to
  # run the quickstart that week.
  #
  # So this job runs the quickstart: build both images, bring the stack up, and
  # require each service to answer /healthz on its published port. A binary that
  # cannot start in its own runtime stage fails here, with its loader error in
  # the log, rather than for whoever tried the project first.
  #
  # Nothing is pushed and nothing is signed: no registry login, no secrets, and
  # a `contents: read` token. The images exist for the length of this job.

  docker-changes:
    name: docker — does this diff reach it?
    runs-on: ubuntu-latest
    permissions:
      # Reads the tree and the base branch to diff against. Nothing else.
      contents: read
    outputs:
      affected: ${{ steps.decide.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to resolve a merge base against the target branch.
          fetch-depth: 0
      - id: decide
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Everything that ends up inside an image or decides how it is built:
          # both Dockerfiles and their crates, the core library they link, the
          # lockfile that pins what is compiled, and the compose file that wires
          # them together.
          #
          # `.github/workflows/ci.yml` is here so a change to this job actually
          # exercises it — but only that file, not the whole workflows
          # directory. The site gate can afford to be wide because its job takes
          # under a minute; this one compiles the workspace twice.
          patterns='^gateway/|^simulator/|^core/|^Cargo\.(toml|lock)$|^docker-compose\.yml$|^\.github/workflows/ci\.yml$'

          base=""
          if [ -n "${BASE_REF:-}" ]; then
            # pull_request: diff against the merge base with the target branch.
            git fetch --no-tags origin "$BASE_REF"
            base="$(git merge-base FETCH_HEAD HEAD || true)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # push: diff against whatever the branch pointed at before.
            base="$BEFORE"
          fi

          # Fail SAFE, not quiet — same rule as site-changes. A first push to a
          # branch, a force-push or a squashed base all leave no usable base
          # commit; build the images rather than assume they are unaffected.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable diff base — running the docker job anyway."
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          if printf '%s\n' "$changed" | grep -qE "$patterns"; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "-> this reaches the images; building and starting the stack."
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing that reaches the images changed; skipping."
          fi

  docker:
    name: docker — quickstart stack builds and starts
    needs: docker-changes
    if: needs.docker-changes.outputs.affected == 'true'
    runs-on: ubuntu-latest
    # Two release builds of the workspace, one per image. Generous enough not to
    # fail on a slow runner, tight enough that a hung container cannot burn an
    # hour: the health wait below gives up long before this does.
    timeout-minutes: 30
    # Only reads the tree. Docker and Compose are preinstalled on the runner, so
    # this job adds no action beyond checkout — the thing proving the supply
    # chain does not widen it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads the tree; it never pushes.
          persist-credentials: false

      # The exact command QUICKSTART.md tells a newcomer to run, minus the `up`.
      # Base images are pinned by digest in both Dockerfiles, so what is built
      # here is what a reader builds.
      - name: Build both images (docker compose build)
        run: docker compose build

      - name: Start the stack (docker compose up -d)
        run: |
          set -euo pipefail
          docker compose up -d
          docker compose ps -a

      # The actual assertion. Publishing a port proves nothing — the container
      # can be dead behind it — so each service has to answer on it.
      #
      # The exited-container check is what makes this fail fast and legibly for
      # the failure it was written for: a glibc mismatch kills the process
      # immediately, and waiting the full minute to report "no answer" would
      # bury the loader error that says exactly what is wrong.
      - name: Both services answer /healthz
        run: |
          set -euo pipefail

          wait_for() {
            local service="$1" url="$2" deadline=$(( SECONDS + 60 )) cid
            echo "waiting for ${service} on ${url} (up to 60s)"
            while :; do
              cid="$(docker compose ps -aq "$service" | head -1)"
              if [ -n "$cid" ] && [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
                echo "::error::${service} exited instead of serving ${url}. The image built, so this is the binary failing to start in the runtime stage — a loader or glibc error below means the build and runtime stages are on different Debian releases."
                docker inspect -f 'exit code: {{.State.ExitCode}}' "$cid"
                docker compose logs --no-color "$service"
                return 1
              fi
              if curl -sf -m 2 "$url" >/dev/null 2>&1; then
                echo "  ${service}: ${url} -> $(curl -s -m 2 "$url")"
                return 0
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::${service} is still running but did not answer ${url} within 60s."
                docker compose logs --no-color "$service"
                return 1
              fi
              sleep 1
            done
          }

          wait_for fednow-sim     http://localhost:8080/healthz
          wait_for fednow-gateway http://localhost:8090/healthz

          echo
          echo "Both services are up and serving. The build-stage binaries start in the runtime stage."
          docker compose ps

      # Whatever went wrong, the logs of both services are the first thing
      # anyone reading a red run wants.
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  workflow-hardening:
    # SECURITY.md tells vendor-risk reviewers that every third-party action in
    # this repository is SHA-pinned and that every workflow starts from
    # `permissions: {}`. Both sentences were true of release.yml and
    # scorecard.yml and false of this file until #84 — the kind of drift nobody
    # notices, because nothing fails when a claim in a document stops being
    # true. This job makes it fail. Checkout plus one bash script: a few
    # seconds, no toolchain, no network, and no third-party action of its own.
    name: workflow hardening
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every action SHA-pinned, every workflow permission-scoped
        run: ./.github/scripts/check-workflow-hardening.sh
