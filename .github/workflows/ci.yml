name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Default to nothing; each job asks for exactly what it needs. Without this,
# every job here inherits the repository default GITHUB_TOKEN scope — and this
# workflow runs on `pull_request`, so that token is handed to code from any
# branch a contributor opens a PR from.
permissions: {}

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # Only reads the tree: actions/checkout needs `contents: read` and this
    # job needs nothing else. No issues, no PR comments, no package writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This action selects the toolchain by *ref*: `@stable` is a branch, not a
      # version. Pinning the SHA therefore means also passing the selection as an
      # input — the pinned commit declares `toolchain` as required. Same pin and
      # same input as release.yml, so CI and the release build the same way.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  python-sdk:
    # Unit tests against a stub, then the SDK's integration suite against a
    # LIVE gateway↔simulator pair in MQ mode — the same stack users run.
    name: python sdk (live stack)
    runs-on: ubuntu-latest
    # Only reads the tree: actions/checkout needs `contents: read` and this
    # job needs nothing else. No issues, no PR comments, no package writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest + the SDK (as a user would)
        run: pip install pytest ./sdk/python
      - name: Build the stack
        run: cargo build -p fednow-sim -p fednow-gateway
      - name: Launch sim + gateway (MQ mode, fast reconcile timings)
        run: |
          ./target/debug/fednow-sim &
          FEDNOW_GW_SOUTHBOUND=mq FEDNOW_GW_SWEEP_SECS=1 \
            FEDNOW_GW_TIMEOUT_SECS=3 FEDNOW_GW_BACKOFF_SECS=2 \
            FEDNOW_GW_DB=/tmp/sdk-ci-gateway.db \
            ./target/debug/fednow-gateway &
          timeout 30 bash -c 'until curl -sf localhost:8090/healthz >/dev/null; do sleep 1; done'
      - name: Unit + integration tests
        run: FEDNOW_GW_URL=http://localhost:8090 python -m pytest sdk/python -q

  java-sdk:
    # Same recipe as the Python job: unit tests on a stub, then the
    # integration suite against a LIVE gateway↔simulator pair in MQ mode.
    name: java sdk (live stack)
    runs-on: ubuntu-latest
    # Only reads the tree: actions/checkout needs `contents: read` and this
    # job needs nothing else. No issues, no PR comments, no package writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build the stack
        run: cargo build -p fednow-sim -p fednow-gateway
      - name: Launch sim + gateway (MQ mode, fast reconcile timings)
        run: |
          ./target/debug/fednow-sim &
          FEDNOW_GW_SOUTHBOUND=mq FEDNOW_GW_SWEEP_SECS=1 \
            FEDNOW_GW_TIMEOUT_SECS=3 FEDNOW_GW_BACKOFF_SECS=2 \
            FEDNOW_GW_DB=/tmp/java-sdk-ci-gateway.db \
            ./target/debug/fednow-gateway &
          timeout 30 bash -c 'until curl -sf localhost:8090/healthz >/dev/null; do sleep 1; done'
      - name: Unit + integration tests
        run: FEDNOW_GW_URL=http://localhost:8090 mvn -q -B -f sdk/java/pom.xml test

  xsd-validate:
    # Validates the valid XML fixtures against the official ISO 20022 schemas
    # vendored in core/schemas/ (see core/schemas/README.md for provenance).
    name: XSD validation
    runs-on: ubuntu-latest
    # Only reads the tree: actions/checkout needs `contents: read` and this
    # job needs nothing else. No issues, no PR comments, no package writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: pacs.008 fixtures
        run: xmllint --noout --schema core/schemas/pacs.008.001.08.xsd core/tests/fixtures/pacs008_valid*.xml
      - name: pacs.002 fixtures
        run: xmllint --noout --schema core/schemas/pacs.002.001.10.xsd core/tests/fixtures/pacs002_valid*.xml
      - name: head.001 fixtures
        run: xmllint --noout --schema core/schemas/head.001.001.02.xsd core/tests/fixtures/head001_valid*.xml
      - name: pacs.028 fixtures
        run: xmllint --noout --schema core/schemas/pacs.028.001.03.xsd core/tests/fixtures/pacs028_valid*.xml
      - name: pacs.004 fixtures
        run: xmllint --noout --schema core/schemas/pacs.004.001.10.xsd core/tests/fixtures/pacs004_valid*.xml
      - name: camt.056 fixtures
        run: xmllint --noout --schema core/schemas/camt.056.001.08.xsd core/tests/fixtures/camt056_valid*.xml
      - name: camt.029 fixtures
        run: xmllint --noout --schema core/schemas/camt.029.001.09.xsd core/tests/fixtures/camt029_valid*.xml

  workflow-hardening:
    # SECURITY.md tells vendor-risk reviewers that every third-party action in
    # this repository is SHA-pinned and that every workflow starts from
    # `permissions: {}`. Both sentences were true of release.yml and
    # scorecard.yml and false of this file until #84 — the kind of drift nobody
    # notices, because nothing fails when a claim in a document stops being
    # true. This job makes it fail. Checkout plus one bash script: a few
    # seconds, no toolchain, no network, and no third-party action of its own.
    name: workflow hardening
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every action SHA-pinned, every workflow permission-scoped
        run: ./.github/scripts/check-workflow-hardening.sh
