name: Weekly Digest (standup)

# tech-lead routine that runs on GitHub: every Friday 17:00 BRT (20:00 UTC)
# it opens a `standup` issue with what merged during the week (grouped by
# crate), open PRs and failed workflow runs. No AI involved — only data from
# GitHub itself; the qualitative reading happens locally with /esteira:standup.

on:
  schedule:
    - cron: "0 20 * * 5"
  workflow_dispatch:

# Default to nothing; each job asks for exactly what it needs.
permissions: {}

jobs:
  digest:
    name: Open the weekly standup issue
    runs-on: ubuntu-latest
    # One job, and it needs all four — the script below reads three different
    # parts of the repository and writes one issue. Each scope maps to a
    # specific call in that script; nothing here is speculative.
    permissions:
      # actions/checkout, plus the `git log` / `git show` walk over the week.
      contents: read
      # issues.create() — the standup issue this workflow exists to open.
      issues: write
      # pulls.list() — the "Open PRs" section. Read-only: the digest reports
      # on pull requests, it never comments on or modifies one.
      pull-requests: read
      # actions.listWorkflowRunsForRepo() — the "Failed workflow runs" section.
      # Read-only: it reads run history, it never triggers or cancels a run.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the digest's `git log --since` walks a week back.
          fetch-depth: 0
          # This job reads the tree and writes an issue; it never pushes.
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { execSync } = require("child_process");
            const since = new Date(Date.now() - 7 * 864e5);
            const sinceIso = since.toISOString();
            const log = execSync(`git log --since="${sinceIso}" --no-merges --pretty=format:"- %h %s (%an)" origin/main`).toString().trim();
            const areas = [
              ["core", /^core\//m], ["simulator", /^simulator\//m], ["gateway", /^gateway\//m],
              ["conformance", /^conformance\//m], ["sdk", /^sdk\//m], ["docs", /^(docs\/|[A-Z]+\.md$)/m],
            ];
            const byArea = Object.fromEntries([...areas.map(a => [a[0], []]), ["other", []]]);
            for (const line of log.split("\n").filter(Boolean)) {
              const sha = line.split(" ")[1];
              const files = execSync(`git show --pretty=format: --name-only ${sha}`).toString();
              const hit = areas.find(([, re]) => re.test(files));
              byArea[hit ? hit[0] : "other"].push(line);
            }
            const prs = (await github.rest.pulls.list({ ...context.repo, state: "open", per_page: 50 })).data
              .map(p => `- #${p.number} ${p.title} (${p.head.ref}, ${p.draft ? "draft" : "open"})`);
            const runs = (await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, per_page: 50, created: `>=${sinceIso.slice(0,10)}` })).data.workflow_runs
              .filter(r => r.conclusion === "failure")
              .map(r => `- ❌ ${r.name} — ${r.head_branch} — ${r.html_url}`);
            const sec = (t, a) => `### ${t}\n${a.length ? a.join("\n") : "_nothing_"}\n`;
            const body = [
              `Week from ${since.toISOString().slice(0,10)} to ${new Date().toISOString().slice(0,10)}.`,
              ...Object.entries(byArea).map(([k, v]) => sec(`Merged — ${k}`, v)),
              sec("Open PRs", prs),
              sec("Failed workflow runs this week", runs),
              "Qualitative reading and next roadmap step: `/esteira:standup` in the repository.",
            ].join("\n");
            await github.rest.issues.create({ ...context.repo, title: `Weekly standup — ${new Date().toISOString().slice(0,10)}`, body, labels: ["standup"] });
