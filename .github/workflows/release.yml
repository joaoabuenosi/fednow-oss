name: Release

on:
  push:
    tags: ["v*"]
  # Rehearsal path. A tag push is a one-shot, irreversible event: by the time a
  # step fails the tag already exists and a half-finished release is public.
  # The dispatch path runs the identical guard, build, SBOM and checksum steps
  # against the working tree so the pipeline can be proven green *before* a tag
  # is ever pushed. See "Rehearsing a release" in CONTRIBUTING.md.
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Rehearse only: build everything and verify the artifacts, but do not
          sign and do not create a GitHub release. Uncheck only to publish a
          tag that is already pushed (run it from that tag's ref).
        type: boolean
        default: true

# Default to nothing; each job asks for exactly what it needs.
permissions: {}

jobs:
  # Everything that produces bytes. Read-only token: this job cannot create a
  # release and cannot mint an OIDC token, so a dry run has no way to publish
  # or sign anything even if a later step misbehaves.
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.guard.outputs.release_tag }}
      dry_run: ${{ steps.guard.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads the tree; it never pushes.
          persist-credentials: false

      # First step on purpose: nothing is built, packaged or signed until the
      # tag is known to match the source. A mistyped tag would otherwise produce
      # assets named after the tag but holding a different version, signed under
      # a certificate identity bound to that wrong tag. Plain awk on the
      # [workspace.package] block — no toolchain, no jq, nothing to install.
      #
      # A dry run has no tag to check, so it derives a synthetic one from the
      # same Cargo.toml field the real guard compares against. Every asset below
      # is then named exactly as the real release would name it, which is the
      # point: the rehearsal exercises the naming, not a placeholder.
      - name: Resolve the release tag and verify it matches the workspace version
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "true" ]; then
            dry_run=true
          else
            dry_run=false
          fi

          version="$(awk '
            /^\[/ { in_block = ($0 == "[workspace.package]"); next }
            in_block && /^version[[:space:]]*=/ {
              sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
            }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi

          if [ "$dry_run" = "true" ]; then
            release_tag="v${version}"
            echo "dry run: no tag exists yet, so the guard uses the synthetic tag ${release_tag}, built from the same Cargo.toml [workspace.package] version (${version}) a real tag would have to match. Nothing will be signed or published."
          else
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::a publishing run must start from a tag, but this run's ref is a ${REF_TYPE} (${REF_NAME}). cosign binds the signing certificate to the ref, so signing a non-tag ref would produce a certificate identity nobody can verify against. Push the tag and let it trigger the workflow, or re-run this dispatch from the tag's ref."
              exit 1
            fi
            if [ "v${version}" != "${REF_NAME}" ]; then
              echo "::error::tag/version mismatch: tag is ${REF_NAME}, but Cargo.toml [workspace.package] version is ${version} (expected tag v${version}). Refusing to build or sign a release whose assets would not match the source."
              exit 1
            fi
            release_tag="${REF_NAME}"
            echo "tag ${REF_NAME} matches Cargo.toml [workspace.package] version ${version}"
          fi

          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release -p fednow-sim -p fednow-gateway -p fednow-conformance

      - name: Package binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/fednow-sim target/release/fednow-gateway target/release/fednow-conformance dist/
          cp LICENSE README.md CHANGELOG.md dist/
          tar -C dist -czf "fednow-oss-${RELEASE_TAG}-x86_64-linux.tar.gz" .

      # Pinned to v0.24.2, the latest release. The three inputs below are not
      # available in every version of this action: `output-file` arrives in
      # v0.10.0, `upload-artifact` and `upload-release-assets` in v0.12.0.
      # v0.9.0 — what #81 pinned this to, and what v0.3.0 ran with — declares
      # none of them; it ignores all three with a warning annotation instead of
      # an error, writes no file, and leaves the failure to surface two steps
      # later in `sha256sum`. Changing this pin means re-reading this action's
      # action.yml, not just matching the SHA to the version comment.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: fednow-oss-${{ steps.guard.outputs.release_tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # An action that ignores an unknown input leaves no file behind and no
      # failure either; the run then dies several steps later in `sha256sum`,
      # pointing at the wrong step. Assert the artifact exists where the step
      # that owns it can still be blamed for it.
      - name: Verify the SPDX SBOM was written
        run: |
          set -euo pipefail
          file="fednow-oss-${RELEASE_TAG}.spdx.json"
          if [ ! -s "$file" ]; then
            echo "::error::SPDX SBOM missing or empty: the 'Generate SBOM (SPDX)' step did not write ${file}. Check that pinned anchore/sbom-action version's action.yml still declares the output-file, upload-artifact and upload-release-assets inputs — an older version ignores them with only a warning annotation and produces no file."
            exit 1
          fi
          echo "SPDX SBOM ok: ${file} ($(wc -c < "$file") bytes)"

      # CycloneDX alongside SPDX: cargo-cyclonedx resolves the real dependency
      # graph out of Cargo.lock, which is the view a reviewer diffs against an
      # advisory feed. Most vendor-risk intake tooling wants CycloneDX by name.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          # cargo-cyclonedx writes one SBOM per workspace member, next to each
          # crate's manifest; the release ships a single merged document.
          cargo cyclonedx --all --format json --spec-version 1.5
          python3 .github/scripts/merge-cyclonedx.py \
            --output "fednow-oss-${RELEASE_TAG}.cdx.json" \
            --name fednow-oss \
            --version "${RELEASE_TAG}" \
            core/fednow-core.cdx.json \
            simulator/fednow-sim.cdx.json \
            gateway/fednow-gateway.cdx.json \
            conformance/fednow-conformance.cdx.json

      - name: Verify the CycloneDX SBOM was written
        run: |
          set -euo pipefail
          file="fednow-oss-${RELEASE_TAG}.cdx.json"
          if [ ! -s "$file" ]; then
            echo "::error::CycloneDX SBOM missing or empty: the 'Generate SBOM (CycloneDX)' step did not write ${file}. Check that cargo-cyclonedx emitted a .cdx.json next to every workspace member's manifest and that .github/scripts/merge-cyclonedx.py found all four."
            exit 1
          fi
          echo "CycloneDX SBOM ok: ${file} ($(wc -c < "$file") bytes)"

      - name: Checksums
        run: |
          set -euo pipefail
          sha256sum fednow-oss-*.tar.gz fednow-oss-*.spdx.json fednow-oss-*.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes from the changelog
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "See CHANGELOG.md." > RELEASE_NOTES.md

      # Hand the exact bytes to the publishing job, so what gets signed is what
      # was built and checksummed here — and so a dry run leaves the full set
      # downloadable from the run page for inspection.
      - name: Upload the release assets for the publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            fednow-oss-*.tar.gz
            fednow-oss-*.spdx.json
            fednow-oss-*.cdx.json
            SHA256SUMS
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

      - name: Dry run summary
        if: steps.guard.outputs.dry_run == 'true'
        run: |
          {
            echo "### Dry run — nothing was signed or published"
            echo
            echo "Synthetic tag: \`${RELEASE_TAG}\` (from Cargo.toml \`[workspace.package] version\`)."
            echo "The assets below are attached to this run as the \`release-assets\` artifact."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Split out purely so the privileges live here. `id-token: write` mints the
  # OIDC token cosign trades with Fulcio, and `contents: write` creates the
  # release; a skipped job is never granted either, so the dry-run path cannot
  # sign or publish no matter what the steps say.
  publish:
    name: Sign and publish
    needs: build
    if: needs.build.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload its assets.
      contents: write
      # Keyless signing: mint the short-lived OIDC token cosign exchanges with
      # Fulcio for an ephemeral certificate. No private key, no repository secret.
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - name: Download the built release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets

      # The signatures below have to cover the bytes the build job checksummed,
      # not whatever survived the artifact round trip. Cheap to prove, so prove it.
      - name: Verify the checksums survived the handoff
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          test -s "fednow-oss-${RELEASE_TAG}.spdx.json"
          test -s "fednow-oss-${RELEASE_TAG}.cdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: cosign swaps the workflow's OIDC token for a short-lived Fulcio
      # certificate, signs, and logs the entry in the Rekor transparency log. The
      # certificate binds the signature to this workflow at this tag — that identity
      # is what `cosign verify-blob --certificate-identity` checks. See SECURITY.md.
      - name: Sign release artifacts (keyless)
        run: |
          set -euo pipefail
          for artifact in fednow-oss-*.tar.gz fednow-oss-*.spdx.json \
                          fednow-oss-*.cdx.json SHA256SUMS; do
            cosign sign-blob --yes \
              --bundle "${artifact}.cosign.bundle" \
              "$artifact"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            fednow-oss-*.tar.gz
            fednow-oss-*.spdx.json
            fednow-oss-*.cdx.json
            SHA256SUMS
            *.cosign.bundle
