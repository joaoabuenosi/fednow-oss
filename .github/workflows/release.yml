name: Release

on:
  push:
    tags: ["v*"]

# Default to nothing; the job asks for exactly what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload its assets.
      contents: write
      # Keyless signing: mint the short-lived OIDC token cosign exchanges with
      # Fulcio for an ephemeral certificate. No private key, no repository secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release -p fednow-sim -p fednow-gateway -p fednow-conformance

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/fednow-sim target/release/fednow-gateway target/release/fednow-conformance dist/
          cp LICENSE README.md CHANGELOG.md dist/
          tar -C dist -czf "fednow-oss-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" .

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a # v0.9.0
        with:
          path: .
          format: spdx-json
          output-file: fednow-oss-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # CycloneDX alongside SPDX: cargo-cyclonedx resolves the real dependency
      # graph out of Cargo.lock, which is the view a reviewer diffs against an
      # advisory feed. Most vendor-risk intake tooling wants CycloneDX by name.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate SBOM (CycloneDX)
        run: |
          # cargo-cyclonedx writes one SBOM per workspace member, next to each
          # crate's manifest; the release ships a single merged document.
          cargo cyclonedx --all --format json --spec-version 1.5
          python3 .github/scripts/merge-cyclonedx.py \
            --output "fednow-oss-${GITHUB_REF_NAME}.cdx.json" \
            --name fednow-oss \
            --version "${GITHUB_REF_NAME}" \
            core/fednow-core.cdx.json \
            simulator/fednow-sim.cdx.json \
            gateway/fednow-gateway.cdx.json \
            conformance/fednow-conformance.cdx.json

      - name: Checksums
        run: sha256sum fednow-oss-*.tar.gz fednow-oss-*.spdx.json fednow-oss-*.cdx.json > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: cosign swaps the workflow's OIDC token for a short-lived Fulcio
      # certificate, signs, and logs the entry in the Rekor transparency log. The
      # certificate binds the signature to this workflow at this tag — that identity
      # is what `cosign verify-blob --certificate-identity` checks. See SECURITY.md.
      - name: Sign release artifacts (keyless)
        run: |
          for artifact in fednow-oss-*.tar.gz fednow-oss-*.spdx.json \
                          fednow-oss-*.cdx.json SHA256SUMS; do
            cosign sign-blob --yes \
              --bundle "${artifact}.cosign.bundle" \
              "$artifact"
          done

      - name: Extract release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "See CHANGELOG.md." > RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            fednow-oss-*.tar.gz
            fednow-oss-*.spdx.json
            fednow-oss-*.cdx.json
            SHA256SUMS
            *.cosign.bundle
