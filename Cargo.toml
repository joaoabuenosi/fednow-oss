[workspace]
resolver = "2"
members = ["core", "simulator", "gateway", "conformance"]
# fuzz/ is a cargo-fuzz crate: nightly-only, builds with a sanitizer, and
# depends on libfuzzer-sys. Excluding it keeps `cargo build/clippy/test` on
# stable working for anyone who never touches it. See fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/joaoabuenosi/fednow-oss"
authors = ["FedNow OSS contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
quick-xml = { version = "0.42", features = ["serialize"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
